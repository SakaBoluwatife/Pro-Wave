[package]
name = "ovrtone-host"
version = "0.1.0"
edition = "2021"
description = "Ovrtone plugin host: scans and loads CLAP plugins for the engine"
license = "GPL-3.0-or-later"

[dependencies]
ovrtone-engine = { path = "../ovrtone-engine" }
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-host", "audio-ports", "gui", "latency", "state", "params", "note-ports"] }
tracing = "0.1.44"
rtrb = "0.4.0"
vst3 = "0.3.0"
libloading = "0.8"

# The window a plugin's editor is shown in.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
assert_no_alloc = "1.1.2"
tempfile = "3.27.0"
