[package]
name = "prowave-host"
version = "0.1.0"
edition = "2021"
description = "ProWave Studio plugin host: scans and loads CLAP plugins for the engine"
license = "GPL-3.0-or-later"

[dependencies]
prowave-engine = { path = "../prowave-engine" }
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-host", "audio-ports", "gui", "latency", "state", "params", "note-ports"] }
tracing = "0.1.44"

# The window a plugin's editor is shown in.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3.27.0"
